# Ustawienia projektowe Gradle.
# Maszyna deweloperska: JBR 21 (domyślne java), NDK 27, Gradle 9.4.1 (wrapper).
# Nie pinujemy org.gradle.java.home — maszyna ma jedno JVM-owe JRE/JDK domyślne.

org.gradle.jvmargs=-Xmx2048M

kotlin.code.style=official

# AndroidX wymagany przez moduł :opentouch-input i Compose.
android.useAndroidX=true
# R klasy nie-transitive — wyłączone, bo kod w modułach odwołuje się do zasobów
# między modułami (tak jak w stosie referencyjnym).
android.nonTransitiveRClass=false
